<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login or Register | PlayJoy</title><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main class="auth-wrap"><div class="panel auth-card"><a class="logo" href="index.html"><span>P</span><span>l</span><span>a</span><span>yJoy</span><small>Small Toys. Big Smiles.</small></a><div class="tabs"><button class="active" data-tab="login">Login</button><button data-tab="register">Create Account</button></div><form id="loginForm"><div class="field"><label>Email or mobile number</label><input type="text" required placeholder="you@example.com"></div><div class="field" style="margin-top:14px"><label>Password</label><input type="password" required minlength="6" placeholder="••••••••"></div><button class="btn btn-blue" style="width:100%;margin-top:20px">Login</button><p style="text-align:center;color:#778499;font-size:12px">Demo sign-in stores no password or personal data.</p></form><form id="registerForm" hidden><div class="form-grid"><div class="field full"><label>Full Name</label><input required></div><div class="field full"><label>Email Address</label><input type="email" required></div><div class="field full"><label>Mobile Number</label><input type="tel" pattern="[0-9]{10}" required></div><div class="field full"><label>Create Password</label><input type="password" minlength="6" required></div></div><button class="btn btn-primary" style="width:100%;margin-top:20px">Create Account</button></form></div></main><div data-site-footer></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#loginForm').hidden=b.dataset.tab!=='login';document.querySelector('#registerForm').hidden=b.dataset.tab!=='register'});document.querySelectorAll('#loginForm,#registerForm').forEach(f=>f.onsubmit=e=>{e.preventDefault();toast(f.id==='loginForm'?'Welcome back to PlayJoy!':'Your PlayJoy account is ready!');setTimeout(()=>location.href='index.html',1000)})});</script></body></html>
