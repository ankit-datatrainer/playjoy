<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | PlayJoy - Small Toys, Big Smiles</title><link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="favicon.svg"/><link rel="shortcut icon" href="favicon.ico"/><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/><meta name="apple-mobile-web-app-title" content="PlayJoy"/><link rel="manifest" href="site.webmanifest"/><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main class="container"><div class="breadcrumb"><a href="index.html">Home</a> › Your Cart</div><div class="section-title"><div><h2>Your Shopping Cart</h2><p>Big smiles are almost on their way.</p></div><a href="shop.html" class="btn btn-outline btn-sm">← Continue shopping</a></div><section class="cart-layout" style="padding-bottom:70px"><div class="panel" id="cartItems"></div><aside class="panel" style="height:max-content"><h2 style="margin-top:0">Order Summary</h2><div class="summary-row"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="summary-row"><span>Shipping</span><b id="shipping">Free</b></div><div class="summary-row"><span>GST (included)</span><span id="tax">₹0</span></div><div class="summary-row total"><span>Total</span><span id="total">₹0</span></div><a href="checkout.html" id="checkoutBtn" class="btn btn-primary" style="width:100%;margin-top:12px">Secure Checkout →</a><p style="text-align:center;color:#7c8799;font-size:11px">🔒 100% secure payment</p></aside></section></main><div data-site-footer></div><script src="app.js"></script><script>
function changeQty(id,d){const c=getCart();c[id]=Math.max(0,(c[id]||0)+d);if(!c[id])delete c[id];saveCart(c);renderCart()}
function renderCart(){const c=getCart(),entries=Object.entries(c),box=document.querySelector('#cartItems');if(!entries.length){box.innerHTML='<div class="empty"><div style="font-size:58px">🛒</div><h2>Your cart is waiting for some joy</h2><p>Explore our safe, colourful toys and find something special.</p><a class="btn btn-primary" href="shop.html">Start shopping</a></div>';document.querySelector('#checkoutBtn').style.pointerEvents='none';document.querySelector('#checkoutBtn').style.opacity='.5'}else{box.innerHTML=entries.map(([id,q])=>{const p=PRODUCTS.find(x=>x.id===id);if(!p)return'';return `<div class="cart-item"><img src="${p.image}" alt="${p.name}" style="width:70px;height:70px;object-fit:contain;border-radius:10px;background:#f8fafc;padding:4px"><div><small style="color:#778499">${p.category}</small><h3>${p.name}</h3><div class="price">${money(priceOf(p))}</div><button class="remove" onclick="changeQty('${id}',-${q})">Remove</button></div><div><div class="qty"><button onclick="changeQty('${id}',-1)">−</button><span>${q}</span><button onclick="changeQty('${id}',1)">+</button></div><b style="display:block;margin-top:16px;text-align:right">${money(priceOf(p)*q)}</b></div></div>`}).join('')}const sub=entries.reduce((s,[id,q])=>s+priceOf(PRODUCTS.find(x=>x.id===id))*q,0);document.querySelector('#subtotal').textContent=money(sub);document.querySelector('#tax').textContent=money(Math.round(sub*.18));document.querySelector('#total').textContent=money(sub)}document.addEventListener('DOMContentLoaded',renderCart);document.addEventListener('b2bchange',renderCart);
</script></body></html>
