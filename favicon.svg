<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="playjoyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#700628" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#playjoyBg)" />

  <!-- Background Orbs -->
  <circle cx="390" cy="110" r="42" fill="#FFFFFF" fill-opacity="0.14" />
  <circle cx="105" cy="405" r="46" fill="#FFFFFF" fill-opacity="0.10" />

  <!-- Bold PlayJoy P with Drop Shadow -->
  <g filter="url(#pShadow)">
    <!-- Loop Outer -->
    <circle cx="274" cy="206" r="108" fill="#FFFFFF" />
    <!-- Connector -->
    <rect x="140" y="98" width="134" height="216" fill="#FFFFFF" />
    <!-- Stem with rounded corner -->
    <rect x="140" y="98" width="84" height="316" rx="28" fill="#FFFFFF" />
  </g>

  <!-- Sky-Blue Badge inside the P Loop -->
  <circle cx="274" cy="206" r="56" fill="#0284C7" />

  <!-- Smiling Face (Small Toys, Big Smiles) -->
  <circle cx="252" cy="198" r="6.5" fill="#FFFFFF" />
  <circle cx="296" cy="198" r="6.5" fill="#FFFFFF" />
  <path d="M249 214 Q274 238 299 214" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Golden Sparkle Star -->
  <g transform="translate(370, 110)">
    <path d="M0 -38 Q4 -9 38 0 Q4 9 0 38 Q-4 9 -38 0 Q-4 -9 0 -38 Z" fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="5" fill="#FFFDE7" />
  </g>
</svg>
