<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Checkout | PlayJoy</title><link rel="stylesheet" href="styles.css"></head><body><div data-site-header></div><main class="container"><div class="breadcrumb"><a href="cart.html">Cart</a> › Secure Checkout</div><div class="section-title"><div><h2>Checkout</h2><p>Fast, safe and secure.</p></div></div><form id="checkoutForm" class="checkout-layout" style="padding-bottom:70px" novalidate><div><section class="panel"><h2>Delivery Details</h2><div class="form-grid"><div class="field"><label>First Name *</label><input name="firstName" required></div><div class="field"><label>Last Name *</label><input name="lastName" required></div><div class="field full"><label>Email Address *</label><input name="email" type="email" required></div><div class="field full"><label>Mobile Number *</label><input name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></div><div class="field full"><label>Street Address *</label><textarea name="address" rows="3" required></textarea></div><div class="field"><label>City *</label><input name="city" required></div><div class="field"><label>State *</label><select name="state" required><option value="">Select state</option><option>Delhi</option><option>Haryana</option><option>Maharashtra</option><option>Rajasthan</option><option>Uttar Pradesh</option><option>West Bengal</option><option>Other</option></select></div><div class="field"><label>PIN Code *</label><input name="pin" pattern="[0-9]{6}" maxlength="6" required></div></div></section><section class="panel" style="margin-top:20px"><h2>Payment Method</h2><label class="payment row" style="gap:10px"><input type="radio" name="payment" checked> <b>Cash on Delivery</b></label><label class="payment row" style="gap:10px"><input type="radio" name="payment"> <span><b>Card / UPI</b><small style="display:block;color:#7b8799">Demo checkout — no live charge is made</small></span></label></section></div><aside class="panel order-summary" style="height:max-content"><h2 style="margin-top:0">Your Order</h2><div id="orderItems"></div><div class="summary-row total"><span>Total</span><span id="orderTotal"></span></div><button class="btn btn-primary" style="width:100%;margin-top:10px" type="submit">Place Order →</button><p style="font-size:11px;color:#7c8799;text-align:center">By ordering, you agree to our terms.</p></aside></form></main><div id="successModal" class="modal"><div class="modal-card success"><div class="check">✓</div><h1>Order placed!</h1><p>Your PlayJoy order <b id="orderNo"></b> is confirmed. A confirmation has been sent to your email.</p><a class="btn btn-blue" href="index.html">Back to Home</a></div></div><div data-site-footer></div><script src="app.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{const c=getCart(),entries=Object.entries(c);if(!entries.length){location.href='cart.html';return}let total=0;document.querySelector('#orderItems').innerHTML=entries.map(([id,q])=>{const p=PRODUCTS.find(x=>x.id===id);total+=p.price*q;return `<div class="summary-row"><span>${p.name} × ${q}</span><b>${money(p.price*q)}</b></div>`}).join('');document.querySelector('#orderTotal').textContent=money(total);document.querySelector('#checkoutForm').onsubmit=e=>{e.preventDefault();const f=e.currentTarget;if(!f.checkValidity()){f.reportValidity();toast('Please complete all required delivery details');return}document.querySelector('#orderNo').textContent='#PJ'+Date.now().toString().slice(-7);localStorage.removeItem('playjoy-cart');document.querySelector('#successModal').classList.add('open');updateBadges()}});
</script></body></html>
