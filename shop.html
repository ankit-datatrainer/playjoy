<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Toys | PlayJoy</title><meta name="description" content="Shop safe, durable and joyful PlayJoy toys for every age."><link rel="stylesheet" href="styles.css"></head><body><div data-site-header="shop"></div><section class="page-hero"><div class="container"><h1>Find their new favourite toy</h1><p>Thoughtfully designed toys for curious minds, little adventurers and big imaginations.</p></div></section><main class="container"><div class="breadcrumb"><a href="index.html">Home</a> › Shop Toys</div><section class="section" style="padding-top:12px"><div class="catalog-layout"><aside class="filters"><div class="filter-group"><h3>Categories</h3><label><input type="radio" name="cat" value="" checked> All Toys</label><label><input type="radio" name="cat" value="Ride Ons"> Ride Ons</label><label><input type="radio" name="cat" value="Educational"> Educational</label><label><input type="radio" name="cat" value="Soft Toys"> Soft Toys</label><label><input type="radio" name="cat" value="Remote Control"> Remote Control</label><label><input type="radio" name="cat" value="Action Figures"> Action Figures</label></div><div class="filter-group"><h3>Maximum Price</h3><input id="priceRange" type="range" min="500" max="2500" value="2500" step="100" style="width:100%"><div class="row" style="justify-content:space-between;font-size:12px;color:#718096"><span>₹500</span><b id="priceLabel">₹2,500</b></div></div><button class="btn btn-outline btn-sm" style="width:100%" id="clearFilters">Clear filters</button></aside><div><div class="catalog-top"><p id="resultCount" style="color:#68758a;margin:0"></p><select id="sort"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rating">Top Rated</option></select></div><div class="products" id="productGrid"></div></div></div></section></main><div data-site-footer></div><script src="app.js"></script><script>
function render(){const p=new URLSearchParams(location.search),q=(p.get('q')||'').toLowerCase(),selected=document.querySelector('input[name=cat]:checked').value,max=+document.querySelector('#priceRange').value,sort=document.querySelector('#sort').value;let list=PRODUCTS.filter(x=>(!selected||x.category===selected)&&x.price<=max&&(!q||(x.name+' '+x.category).toLowerCase().includes(q)));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);if(sort==='rating')list.sort((a,b)=>b.rating-a.rating);document.querySelector('#resultCount').textContent=list.length+' joyful toys found';document.querySelector('#productGrid').innerHTML=list.length?list.map(productCard).join(''):'<div class="empty"><h2>No toys found</h2><p>Try a different category or price range.</p></div>';setTimeout(()=>document.querySelectorAll('.reveal').forEach(x=>x.classList.add('visible')),30)}
document.addEventListener('DOMContentLoaded',()=>{const p=new URLSearchParams(location.search),cat=p.get('category');if(cat){const radio=[...document.querySelectorAll('input[name=cat]')].find(x=>x.value===cat);if(radio)radio.checked=true}if(p.get('sort'))document.querySelector('#sort').value=p.get('sort');document.querySelectorAll('input[name=cat],#sort,#priceRange').forEach(x=>x.addEventListener('input',()=>{document.querySelector('#priceLabel').textContent=money(document.querySelector('#priceRange').value);render()}));document.querySelector('#clearFilters').onclick=()=>{document.querySelector('input[name=cat][value=""]').checked=true;document.querySelector('#priceRange').value=2500;document.querySelector('#sort').value='featured';history.replaceState({},'', 'shop.html');render()};render()});
</script></body></html>
